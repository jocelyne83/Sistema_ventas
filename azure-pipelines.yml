trigger:
  - main   # Se ejecuta cada vez que subas cambios a la rama main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Instalar Node.js'

  - script: |
      npm install
    displayName: 'Instalar dependencias'

  - script: |
      npm run build
    displayName: 'Construir aplicación'
    continueOnError: true   # Si tu proyecto no tiene build, no detiene el pipeline

