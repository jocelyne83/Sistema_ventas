trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Instalar Node.js'

  - script: |
      npm install
      npm start
    displayName: 'Instalar dependencias y construir la aplicación'

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
      replaceExistingArchive: true
    displayName: 'Empaquetar aplicación'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'Azure-devops_sistemaventas'    
      appType: 'webApp'                       
      appName: 'sistema-ventas'                        
      package: '$(Build.ArtifactStagingDirectory)/app.zip'
    displayName: 'Desplegar a Azure Web App'
